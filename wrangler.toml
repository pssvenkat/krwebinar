name = "krwebinar"
main = "src/server/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Custom Domains
routes = [
  { pattern = "webinar.kravefoods.in", custom_domain = true }
]

# Serve static assets from dist/client
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "krwebinar-db"
database_id = "45ff657a-2a70-45f3-8ad0-2364b18ed499"
migrations_dir = "db/migrations"

# R2 Bucket for assets (uncomment once R2 is enabled in dashboard)
# [[r2_buckets]]
# binding = "ASSETS_BUCKET"
# bucket_name = "krwebinar-assets"

# Durable Objects
[[durable_objects.bindings]]
name = "WEBINAR_ROOM"
class_name = "WebinarRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WebinarRoom"]

# Environment variables (non-secret)
[vars]
ENVIRONMENT = "production"
PLATFORM_NAME = "WebinarPlatform"

# Development environment overrides
[env.development]
[env.development.vars]
ENVIRONMENT = "development"

# Production environment overrides
[env.production]
[env.production.vars]
ENVIRONMENT = "production"

# Cron triggers — Phase 6
# Every 15 minutes: send 30-min pre-webinar reminder emails
[triggers]
crons = ["*/15 * * * *"]
